[build-system]
# build the package with [flit](https://flit.readthedocs.io)
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aiida-trainspot"
dynamic = ["version"]
description = "AiiDA workchain to generate data for training and testing of neural networks."
authors = [{name = "Nataliia Manko"}, {name = "Davide Bidoggia"}, {name = "Antimo Marrazzo"}, {name = "Maria Peressi"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Development Status :: 4 - Beta",
    "Framework :: AiiDA"
]
keywords = ["aiida", "workchain"]
requires-python = ">=3.7"
dependencies = [
    "aiida-core>=2.6.2,<3",
    "voluptuous",
    "ase==3.29.0",
    "numba",
    "aiida-quantumespresso",
    "aiida-lammps",
    "h5py"
]

[project.urls]
Source = "https://github.com/aiida-trieste-developers/aiida-trainspot"



[project.entry-points.'aiida.workflows']
"trainspot.datasetaugmentation"   = "aiida_trainspot.workflows.dataset_augmentation:DatasetAugmentationWorkChain"
"trainspot.labelling"        = "aiida_trainspot.workflows.labelling:AbInitioLabellingWorkChain"
"trainspot.training"         = "aiida_trainspot.workflows.training:TrainingWorkChain"
"trainspot.exploration"      = "aiida_trainspot.workflows.exploration:ExplorationWorkChain"
"trainspot.lammps_md"        = "aiida_trainspot.workflows.lammps_md:LammpsMdWorkChain"
"trainspot.workflow"         = "aiida_trainspot.workflows.trainspot:TrainsPotWorkChain"



[project.entry-points.'aiida.calculations']
"trainspot.evaluation"       = "aiida_trainspot.calculations.evaluation:EvaluationCalculation"

[project.entry-points.'aiida.parsers']
"trainspot.evaluation"       = "aiida_trainspot.parsers.evaluation:EvaluationParser"

[project.entry-points."aiida.data"]
"pesdata"                    = "aiida_trainspot.data.pesdata:PESData"



##[project.entry-points."aiida.cmdline.data"]
[project.scripts]
portable_codes_installation = "aiida_trainspot.utils.install_portable_codes:main"

[project.optional-dependencies]
mace = ["aiida-mace"]
metatrain = ["aiida-metatrain"]
nequip = ["aiida-nequip"]
deepmd = ["aiida-deepmd"]
docs = [
    "aiida-core~=2.5",
    "docutils",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-book-theme",
    "sphinx-click",
    "sphinxcontrib-contentui",
    "furo",
    "markupsafe"
]
# Self-references: bare names here would resolve to unrelated PyPI projects.
all = ["aiida-trainspot[mace,metatrain,nequip,deepmd,docs]"]

[tool.flit.module]
name = "aiida_trainspot"

[tool.flit.sdist]
exclude = [
    "docs/",
    "tests/",
]



[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Object of type .* not in session, .* operation along .* will not proceed:sqlalchemy.exc.SAWarning",
    "ignore:Creating AiiDA configuration folder.*:UserWarning",
    "ignore::DeprecationWarning:frozendict:",
    "ignore::DeprecationWarning:pkg_resources:",
    "ignore::DeprecationWarning:sqlalchemy_utils:",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

format.quote-style = "double"
format.indent-style = "space"
format.skip-magic-trailing-comma = false
format.line-ending = "lf"

fix = true
show-fixes = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "PL"]

ignore = [
    "PLR0915",  # Too many statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "D205",    # 1 blank line required between summary line and description
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
lines-between-types = 1

[tool.tox]
legacy_tox_ini = """
[tox]
envlist =
    py{38,39,310,311,312,313}
    py38-pre-commit

[testenv]
description = Run the pytest tests
usedevelop=True
extras = tests
commands = pytest {posargs}

[testenv:py38-pre-commit]
description = Run Ruff and pre-commit checks
extras =
    tests
    pre-commit
commands =
    pre-commit run --all-files
"""
